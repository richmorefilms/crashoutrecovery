{% extends "base.html" %}
{% block title %}Ranked Feed — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page feed-page--ranked">
  <header class="unified-feed-header">
    <h1 class="unified-feed-title" data-ui-copy="ranked_feed">{{ uc.ranked_feed.label }}</h1>
    <p class="unified-feed-desc" data-ui-copy="ranked_feed" data-ui-field="tooltip">{{ uc.ranked_feed.tooltip }}</p>
    <p class="unified-feed-actions">
      <a class="feed-cta feed-cta--ghost" href="/personalized" data-ui-copy="personalized_feed">{{ uc.personalized_feed.label }}</a>
    </p>
  </header>
  <div id="ranked-feed-root" class="unified-feed-grid" aria-live="polite"></div>
  <p id="ranked-feed-empty" class="unified-feed-empty" hidden>No ranked clips yet.</p>
  <p id="ranked-feed-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/ranked-feed.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutRankedFeed?.mount?.("#ranked-feed-root");
  });
</script>
{% endblock %}
