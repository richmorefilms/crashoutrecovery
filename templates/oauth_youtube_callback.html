{% extends "base.html" %}
{% block title %}YouTube Linked — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main auth-page auth-page--youtube-oauth">
  <section class="auth-page-card">
    <h1 class="auth-page-title" data-ui-copy="youtube_linked">{{ uc.youtube_linked.label }}</h1>
    <p id="oauth-youtube-status" class="auth-page-lede" role="status">Connecting…</p>
    <p id="oauth-youtube-error" class="unified-feed-error" hidden role="alert"></p>
    <p class="auth-guest-note">
      <a href="/creator/dashboard" data-ui-copy="creator_hub">{{ uc.creator_hub.label }}</a>
      · <a href="/" data-ui-copy="nav_home">{{ uc.nav_home.label }}</a>
    </p>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/oauth-youtube.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutYouTubeOAuth?.handleCallback?.();
  });
</script>
{% endblock %}
