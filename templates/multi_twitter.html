{% extends "base.html" %}
{% block title %}Twitter — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page multi-platform-page multi-platform-page--twitter page-container hybrid-glow" data-platform="twitter">
  <header class="console-header">
    <p class="v16-kicker" data-ui-copy="multi_twitter">{{ uc.multi_twitter.label }}</p>
    <h1 class="console-title title neon-title" data-ui-copy="multi_twitter">{{ uc.multi_twitter.label }}</h1>
    <p class="console-desc" data-ui-copy="multi_twitter" data-ui-field="tooltip">{{ uc.multi_twitter.tooltip }}</p>
  </header>
  <div id="multi-twitter-root" class="unified-feed-grid grid" aria-live="polite"></div>
  <p id="multi-twitter-empty" class="unified-feed-empty" hidden>No clips yet.</p>
  <p id="multi-twitter-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/multi-twitter.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutMultiTwitter?.mount?.("#multi-twitter-root");
  });
</script>
{% endblock %}
