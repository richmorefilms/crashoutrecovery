{% extends "base.html" %}
{% block title %}Pinterest — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page multi-platform-page multi-platform-page--pinterest page-container hybrid-glow" data-platform="pinterest">
  <header class="console-header">
    <p class="v16-kicker" data-ui-copy="multi_pinterest">{{ uc.multi_pinterest.label }}</p>
    <h1 class="console-title title neon-title" data-ui-copy="multi_pinterest">{{ uc.multi_pinterest.label }}</h1>
    <p class="console-desc" data-ui-copy="multi_pinterest" data-ui-field="tooltip">{{ uc.multi_pinterest.tooltip }}</p>
  </header>
  <div id="multi-pinterest-root" class="unified-feed-grid grid" aria-live="polite"></div>
  <p id="multi-pinterest-empty" class="unified-feed-empty" hidden>No clips yet.</p>
  <p id="multi-pinterest-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/multi-pinterest.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutMultiPinterest?.mount?.("#multi-pinterest-root");
  });
</script>
{% endblock %}
