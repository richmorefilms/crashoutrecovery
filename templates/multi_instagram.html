{% extends "base.html" %}
{% block title %}Instagram — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page multi-platform-page multi-platform-page--instagram" data-platform="instagram">
  <header class="console-header">
    <p class="v16-kicker" data-ui-copy="multi_instagram">{{ uc.multi_instagram.label }}</p>
    <h1 class="console-title" data-ui-copy="multi_instagram">{{ uc.multi_instagram.label }}</h1>
    <p class="console-desc" data-ui-copy="multi_instagram" data-ui-field="tooltip">{{ uc.multi_instagram.tooltip }}</p>
  </header>
  <div id="multi-instagram-root" class="unified-feed-grid" aria-live="polite"></div>
  <p id="multi-instagram-empty" class="unified-feed-empty" hidden>No clips yet.</p>
  <p id="multi-instagram-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/multi-instagram.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutMultiInstagram?.mount?.("#multi-instagram-root");
  });
</script>
{% endblock %}
