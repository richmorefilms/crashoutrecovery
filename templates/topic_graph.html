{% extends "base.html" %}
{% block title %}Topic Graph — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page feed-page--topic-graph recs-explorer">
  <header class="console-header">
    <p class="v16-kicker" data-ui-copy="topic_graph">{{ uc.topic_graph.label }}</p>
    <h1 class="console-title" data-ui-copy="topic_graph">{{ uc.topic_graph.label }}</h1>
    <p class="console-desc" data-ui-copy="topic_graph" data-ui-field="tooltip">{{ uc.topic_graph.tooltip }}</p>
  </header>
  <div id="topic-graph-root" class="topic-graph-list" aria-live="polite"></div>
  <p id="topic-graph-empty" class="unified-feed-empty" hidden>No graph nodes yet.</p>
  <p id="topic-graph-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/topic-graph.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutTopicGraph?.mount?.("#topic-graph-root");
  });
</script>
{% endblock %}
