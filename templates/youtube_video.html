{% extends "base.html" %}
{% block title %}YouTube Video — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main youtube-page youtube-page--video page-container hybrid-glow">
  <header class="youtube-page-header">
    <h1 class="youtube-page-title title neon-title" data-ui-copy="youtube_video">{{ uc.youtube_video.label }}</h1>
    <p class="youtube-page-desc" data-ui-copy="youtube_video" data-ui-field="tooltip">{{ uc.youtube_video.tooltip }}</p>
  </header>
  <div id="youtube-video-root" class="youtube-detail" aria-live="polite"
       data-video-id="{{ video_id }}"></div>
  <p id="youtube-video-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/youtube-video.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutYouTubeVideo?.mount?.("#youtube-video-root");
  });
</script>
{% endblock %}
