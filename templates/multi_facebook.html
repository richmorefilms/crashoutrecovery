{% extends "base.html" %}
{% block title %}Facebook — {{ app_name }}{% endblock %}
{% block content %}
{% set uc = ui_copy or {} %}
<main class="app-main feed-page multi-platform-page multi-platform-page--facebook page-container hybrid-glow" data-platform="facebook">
  <header class="console-header">
    <p class="v16-kicker" data-ui-copy="multi_facebook">{{ uc.multi_facebook.label }}</p>
    <h1 class="console-title title neon-title" data-ui-copy="multi_facebook">{{ uc.multi_facebook.label }}</h1>
    <p class="console-desc" data-ui-copy="multi_facebook" data-ui-field="tooltip">{{ uc.multi_facebook.tooltip }}</p>
  </header>
  <div id="multi-facebook-root" class="unified-feed-grid grid" aria-live="polite"></div>
  <p id="multi-facebook-empty" class="unified-feed-empty" hidden>No clips yet.</p>
  <p id="multi-facebook-error" class="unified-feed-error" hidden role="alert"></p>
</main>
{% endblock %}
{% block scripts %}
<script type="application/json" id="ui-copy-data">{{ ui_copy | tojson }}</script>
<script src="/static/ui-copy.js"></script>
<script src="/static/multi-facebook.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.CrashoutMultiFacebook?.mount?.("#multi-facebook-root");
  });
</script>
{% endblock %}
